<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeaafletJS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }
    </style>

</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        //initialize map
        var map = L.map('map').setView([-7.7, 110.5], 11);


        // Tile Layer Base Map
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Badan Informasi Geospasial'
        });
        var Google_Terrain = L.tileLayer('https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ["mt0", "mt1", "mt2", "mt3"],
            attribution: 'Google'
        });

        // Menambahkan basemap ke dalam peta
        Google_Terrain.addTo(map);

        // Marker
        var marker1 = L.marker([-7.7, 110.5]);
        var marker2 = L.marker([-7.5907181, 110.4649222]);
        var marker3 = L.marker([-7.602317490651855, 110.50942579877302]);
        // Menambahkan marker ke dalam peta
        marker1.addTo(map);
        marker2.addTo(map);
        marker3.addTo(map);

        // Popup
        marker1.bindPopup("<b>Bangunan Fasum</b><br>Bangunan Peribadatan");
        marker2.bindPopup("<b>Bangunan Fasum</b><br>Bangunan Permukiman");
        marker3.bindPopup("<b>Bangunan Fasum</b><br>Bangunan Pendidikan");
        //marker1.openPopup();

        // Tooltip
        marker1.bindTooltip("Klaten");
        marker2.bindTooltip("Klaten");
        marker3.bindTooltip("Klaten");
        //marker1.openTooltip();

        // Circle
        var circle = L.circle([-7.5414442, 110.4463291], {
            color: "green", // warna garis
            opacity: 1, // opacity garis
            fillColor: "yellow", // warna fill
            fillOpacity: 0.5, // opacity fill
            radius: 10000, // radius dalam meter
        });

        // Menambahkan circle ke dalam peta
        circle.addTo(map);
        circle.bindPopup("radius 10 Km");
        circle.bindTooltip("Kawasan lereng gunung", { sticky: true });

        // Polyline
        var vertexPolyline = [
            [-7.7, 110.5],
            [-7.5907181, 110.4649222],
            [-7.602317490651855, 110.50942579877302],
        ];
        var polyline = L.polyline(vertexPolyline, {
            color: "red", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);
        polyline.bindPopup("rute");
        polyline.bindTooltip("jarak tempuh 24 Km", { sticky: true })

        // Polygon
        var vertexPolygon = [
            [-7.7422906, 110.3432465],
            [-7.7661034, 110.4318237],
            [-7.7824314, 110.4297638],
            [-7.7837921, 110.4105377],
            [-7.7837921, 110.4105377],
            [-7.8354931, 110.4057312],
            [-7.8232487, 110.3226471],
        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "blue", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
            fillColor: "orange", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);
        polygon.bindPopup("Kota Yogyakarta");
        polygon.bindTooltip("D.I.Y Yogyakarta", { sticky: true });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "Google Terrain": Google_Terrain
        };

        var overlayMaps = {
            "marker 1": marker1,
            "marker 2": marker2,
            "marker 3": marker3,
            "circle": circle,
            "rute": polyline,
            "polygon": polygon,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });

        controllayer.addTo(map);

        // Scale
        var scale = L.control.scale();
        var scale = L.control.scale({
            position: "bottomright",
        });
        var scale = L.control.scale({
            imperial: false,
        });
        scale.addTo(map);

        // Geolocation
        map.locate({
            setView: true,
            maxZoom: 16,
        });

        // Fungsi untuk menampilkan lokasi
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            // Menampilkan marker pada lokasi 
            L.marker(e.latlng).addTo(map).bindPopup("Anda berada dalam radius " + radius + " meter dari titik ini").openPopup();

            // Menampilkan circle pada lokasi
            L.circle(e.latlng, radius).addTo(map);
        }

        map.on("locationfound", onLocationFound);

        // Fungsi untuk menampilkan pesan error
        function onLocationError(e) {
            alert(e.message);
        }

        map.on("locationerror", onLocationError);
    </script>

</body>

</html>
